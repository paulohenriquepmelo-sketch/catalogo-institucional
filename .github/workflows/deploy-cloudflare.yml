name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs não podem cancelar um deploy de produção em andamento.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'cloudflare-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy editor + public
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nada é publicado se algum teste falhar.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Pull requests só testam e compilam; o deploy acontece no push na main.
      - name: Stop here on pull requests
        if: github.event_name == 'pull_request'
        run: echo "Testes e build ok; deploy apenas na main."

      - name: Validate Cloudflare credentials
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy editor Worker
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc --env editor

      - name: Deploy public Worker
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc --env public
